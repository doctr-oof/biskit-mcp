# Biskit project settings.
#
# This file is checked into version control and shared by everyone on the project.
# For personal overrides that should not be committed, use settings.local.yml —
# it accepts the same keys and takes priority over anything set here.
#
# Every key below is optional. The commented values are the defaults.

lsp:
  # Release tag of luau-lsp to use. The carpenter fork tags with a leading "v".
  # version: "v0.2.0"

  # GitHub repository the release asset is downloaded from.
  # repository: "Sawhorse-Interactive/luau-lsp-carpenter"

  # Override the download URL entirely. Supports {version} and {asset} placeholders.
  # Only github.com and its release-asset hosts are permitted unless you also set
  # a matching checksum.
  # download_url_template: null

  # Skip downloading and use an executable you already have. Absolute path.
  # binary_path: null

  # SHA-256 digests keyed by release asset filename. Biskit ships pinned digests for
  # the default version; set these when you pin a different version, because the
  # carpenter fork does not publish checksums of its own.
  # checksums: {}

  # Refuse to run a downloaded binary that has no known digest. Turning this off
  # allows unverified downloads — only do so for a version you control.
  # require_checksum: true

  # "roblox" enables the DataModel-aware platform and Roblox global types.
  # "standard" is for plain Luau projects with no Roblox API surface.
  # platform: roblox

  # Which Roblox API dump to load. Higher levels expose more restricted members.
  # One of: None, PluginSecurity, LocalUserSecurity, RobloxScriptSecurity
  # roblox_security_level: PluginSecurity

  # Where Roblox global type definitions are fetched from. {security_level} is substituted.
  # type_definitions_url: "https://luau-lsp.pages.dev/type-definitions/globalTypes.{security_level}.d.luau"

  # API documentation source. Defaults to the Roblox docs on the roblox platform and
  # the plain Luau docs on the standard platform.
  # documentation_url: null

  # Extra definition files, appended after the fetched Roblox globals.
  # Each entry is "@alias=relative/path.d.luau".
  # definition_files: []

  # Extra documentation JSON files, given as project-relative paths.
  # documentation_files: []

  # Additional arguments appended to the `luau-lsp lsp` invocation.
  # extra_args: []

  # Project-relative path to a .luaurc used as the configuration base.
  # base_luaurc: null

  # Project-relative path to the Rojo sourcemap. Set to null to disable sourcemap
  # loading entirely. Generate it with:
  #   rojo sourcemap --include-non-scripts --watch default.project.json --output sourcemap.json
  # sourcemap: "sourcemap.json"

  # Watch the sourcemap file and tell the language server when it changes. Without
  # this, a regenerated sourcemap needs a restart_language_server call to take effect.
  # watch_sourcemap: true

  # Raw luau-lsp settings passed straight through, in VS Code dotted-key form.
  # Anything valid in the luau-lsp VS Code extension works here, and anything set
  # here wins over the defaults Biskit sends.
  #
  # Biskit turns the luau-lsp.inlayHints.* keys on by default, because luau-lsp
  # ships them off and get_inlay_hints would then have nothing to report. Turn any
  # of them back off here.
  # server_settings:
  #   luau-lsp.diagnostics.strictDatamodelTypes: true
  #   luau-lsp.inlayHints.variableTypes: false

  # How long to wait for the language server to become ready, in milliseconds.
  # startup_timeout_ms: 60000

  # How long any single language server request may take, in milliseconds.
  # request_timeout_ms: 30000

  # How long to wait for diagnostics to settle after opening a file, in milliseconds.
  # diagnostics_settle_ms: 1500

  # How many files may stay open in the language server at once. Every file a tool
  # reaches for is opened there and stays in its working set, so an unbounded set
  # makes every later request answer against more documents than the one before it.
  # Once the ceiling is passed the least recently used files are closed again;
  # reaching for one of them later reopens it. Set to 0 for no ceiling.
  # max_open_documents: 256

project:
  # Extra paths excluded from every walk: find_file, list_dir, search_for_pattern,
  # and the project scan that find_symbol runs when given no relative_path.
  # Gitignore syntax, one pattern per entry, for example "Packages/" or
  # "**/node_modules". A leading "!" is taken literally rather than as a
  # re-include, since every entry here names something to exclude.
  #
  # These are also handed to luau-lsp as its ignoreGlobs, so the language server
  # and Biskit build the same view of the project. Set luau-lsp.ignoreGlobs under
  # lsp.server_settings to override that and let the two differ.
  #
  # Patterns are matched against the project root wherever a walk starts, so
  # "src/vendor/" still excludes that directory when list_dir is called on "src".
  # Naming an excluded directory itself as relative_path lists it anyway: the
  # exclusion filters what a walk descends into, not where a caller points it.
  # ignored_paths: []

  # Honour .gitignore and .git/info/exclude when walking the project.
  #
  # This is what usually hides Packages/ from find_file, list_dir, and
  # search_for_pattern. It does not hide anything from the require graph or from
  # resolve_instance_path: files the rojo sourcemap names are part of the game,
  # so they are scanned whether or not this is on.
  # respect_gitignore: true

  # Run Biskit without the Luau language server. Nothing is downloaded, no
  # luau-lsp process starts, and the symbol and diagnostic tools are not exposed
  # to the agent. Memory, file, and search tools keep working. Useful for
  # non-Luau projects and for machines that cannot fetch the release asset.
  # memory_only: false

  # Count the carpenter fork's shared("Name") string require as a dependency
  # edge in get_require_graph and get_module_context. Sawhorse Roblox frameworks
  # give the shared global a __call metamethod, which makes shared("Foo") a
  # require of the module whose file is named Foo.luau.
  #
  # This governs Biskit's own scan only. The language server fork resolves
  # shared() unconditionally and has no switch for it, so turning this off does
  # not stop diagnostics, hover, or go to definition from following those calls.
  # It only makes the require graph stop reporting them, which get_status will
  # tell you about.
  # shared_require: true

tools:
  # Tool names to hide from the agent entirely.
  # excluded: []

  # Truncation thresholds. Raise them if you are routinely losing results,
  # lower them to keep responses small.

  # Ceiling on a single tool result. A structured result over the ceiling is
  # refused with a message naming what to narrow, because half a JSON document
  # cannot be read; a text result, such as a memory, is cut and says so. Set to
  # 0 to lift the ceiling entirely.
  # max_answer_chars: 50000

  # max_listing_entries: 2000

  # Cap on what search_for_pattern returns. In the default snippet mode this counts
  # snippets; in "files" and "counts" mode it counts files, so a reported count is
  # the file's real count rather than however much of the budget was left.
  # max_pattern_matches: 200

  # Cap on references returned by find_referencing_symbols. Kept separate from
  # max_listing_entries because a reference carries a source snippet and a name
  # path, where a listing entry is one path.
  # max_reference_matches: 200

  # Keep symbol trees in .biskit/cache/ across sessions, keyed by each file's path,
  # size, and modification time. A file that has not moved is answered from the
  # index instead of costing another round trip to the language server, which is
  # what a project-wide find_symbol pays once per candidate file. Turn it off to
  # ask the language server every time.
  # symbol_cache: true

  # How many symbol trees the index holds before the ones nothing has reached for
  # are dropped. Set to 0 to keep every file ever indexed.
  # max_cached_symbol_files: 4000
