[package]
name = "biskit-mcp"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Project memory and Luau code intelligence over the Model Context Protocol"
repository = "https://github.com/doctr-oof/biskit-mcp"
license = "MIT"
readme = "README.md"

[[bin]]
name = "biskit-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.1.2", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde-saphyr = "1.1"
ureq = "3.4"
sha2 = "0.11"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
ignore = "0.4.33"
globset = "0.4.20"
regex = "1.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
directories = "6.0"
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
